# Generated by the configuration wizard for dx-demo.apps.promox.europesip-lab.com on 2026-11-10.
# Based on lab1-dx-base/ingress-dx.yaml (hcl-dx-compose-labs), with your values already filled in.
# lab-base · Ingress: TLS terminated with dx-tls-cert and re-encrypted towards the DX HAProxy, the only entry point of DX.

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dx-deployment-ingress
  namespace: dx-demo
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"          # large uploads to DAM
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"     # long IQ responses
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - dx-demo.apps.promox.europesip-lab.com
      secretName: dx-tls-cert
  rules:
    - host: dx-demo.apps.promox.europesip-lab.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dx-deployment-haproxy
                port:
                  number: 443
