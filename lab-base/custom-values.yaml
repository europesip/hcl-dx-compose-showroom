# Generated by the configuration wizard for dx-demo.apps.promox.europesip-lab.com on 2026-11-10.
# Based on lab1-dx-base/custom-values.yaml (hcl-dx-compose-labs), with your values already filled in.
# lab-base · Base DX Compose values (chart hcl-dx-deployment 2.50.0, CF239). Each later lab adds its own layer on top with -f.

images:
  repository: "hclcr.io"
  imagePullSecrets:
    - name: regcred          # in lab-base/secrets.yaml

# Volumes: the two StorageClasses of the requirements (RWO and RWX)
volumes:
  digitalAssetManagement:
    binaries:                # shared by every DAM pod -> RWX
      storageClassName: "dx-deploy-rwx"
      requests:
        storage: "10Gi"
  persistenceNode:
    database:                # DX internal PostgreSQL (DAM, People Service, internal IQ)
      storageClassName: "dx-deploy-rwo"
      requests:
        storage: "10Gi"
  licenseManager:
    data:
      storageClassName: "dx-deploy-rwo"
      requests:
        storage: "2Gi"
  webEngine:
    customization:           # server profile and Derby (minimum 5Gi: Derby takes ~700Mi)
      storageClassName: "dx-deploy-rwo"
      requests:
        storage: "5Gi"
    log:
      storageClassName: "dx-deploy-rwo"
      requests:
        storage: "5Gi"

# What is deployed: DX Compose = Web Engine (not Core). Without the DX OpenLDAP (we use an
# external one in lab-bbdd) and without Remote Search.
applications:
  core: false
  webEngine: true
  openLdap: false            # the chart default is true
  remoteSearch: false
  persistence: true          # Persistence Node: DAM database

peopleservice:
  enabled: false

networking:
  webEngine:
    host: "dx-demo.apps.promox.europesip-lab.com"
  haproxy:
    # ClusterIP: published with an Ingress (Kubernetes) or a Route (OpenShift), see lab-base/
    serviceType: "ClusterIP"
  # TLS certificate served by HAProxy (created by install.sh, step 1-3)
  tlsCertSecret: "dx-tls-cert"

security:
  webEngine:
    # wpsadmin credentials in a secret. With customWebEngineSecret, the plain-text user and
    # password must be empty (otherwise the chart refuses to install).
    webEngineUser: null
    webEnginePassword: null
    customWebEngineSecret: "web-engine-secret"

logging:
  webEngine:
    level:
      - "*=info"

configuration:
  containerTimezone: "Europe/Madrid"   # any IANA time zone, e.g. "Europe/London", "UTC"
  # Container that validates the requirements (storage, resources) before each pod starts
  prereqsChecker:
    enabled: true
