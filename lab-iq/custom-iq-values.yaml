# Generated by the configuration wizard for dx-demo.apps.promox.europesip-lab.com on 2026-11-10.
# Based on lab3-iq-openrouter/custom-iq-values.yaml (hcl-dx-compose-labs), with your values already filled in.
# lab-iq · IQ values (chart hcl-dx-iq 1.0.3): IQ goes through the DX HAProxy and uses LiteLLM in the shared namespace.
# LITELLM_BASE_URL is undocumented but essential in IQ 1.0.2 and 1.0.3.

images:
  repository: "hclcr.io"
  imagePullSecrets:
    - name: regcred
  # No tags: the chart ships the images compatible with CF239

configuration:
  dx:
    releaseName: "dx-deployment"   # = DX_RELEASE
    externalHost: "dx-demo.apps.promox.europesip-lab.com"               # = DX_HOST; the LLM uses it to build the links it returns
    # Empty = enter through the DX HAProxy (https://<releaseName>-haproxy:443)
    internalHost: ""
    port: 443
    ssl: true

  # Chat sessions in in-memory SQLite (lost when the pod restarts). To store them in the
  # PostgreSQL of the shared namespace, see the GUIDE appendix (custom-iq-values.db-external.yaml).
  database:
    enabled: false

  mcpServer:
    # HTTPS, as in the example values of the HCL documentation ("Deploying IQ services"): the MCP Server uses
    # the HAProxy certificate (dx-tls-cert) and the chart writes https://<IQ_RELEASE>-mcp-server:3000 in the
    # Integrator ConfigMap. Custom MCP servers can stay on HTTP.
    httpsEnabled: true
    tlsCertSecret: "dx-tls-cert"
    standaloneMode: false
    enableWcm: true
    # IQ 1.0.3 publishes valid tool names (no dots, see litellm-values.yaml). HCL still says to
    # disable it with non-Claude models -> enableDam: false
    enableDam: true

  # LiteLLM lives in another namespace: the service FQDN is used (= LITELLM_URL_INTERNAL)
  litellm:
    liteLlmUrl: "http://litellm.dx-shared.svc.cluster.local:4000"

  # licensing.deploymentKey is NOT here: the chart cannot read it from a secret yet (only from its values), so
  # demo.sh reads it from the Secret iq-deployment-key (lab-iq/secrets.yaml) and passes it with --set.

environment:
  pod:
    integrator:
      - name: "DX_CONTEXT_ROOT"
        value: "/wps"
      # Response token cap, below the maximum of both models (Haiku 4.5: 64k)
      - name: "LLM_MAX_TOKENS"
        value: "16384"
      # Undocumented but essential in Integrator 1.0.2 and 1.0.3: it is the URL the LLM adapter really
      # uses. Without it, it calls an internal HCL URL. Same value as litellm.liteLlmUrl.
      - name: "LITELLM_BASE_URL"
        value: "http://litellm.dx-shared.svc.cluster.local:4000"
      # LITELLM_URL and LITELLM_API_KEY do NOT go here: the chart redefines them. The key comes
      # from the iq-litellm-api-secret secret (lab-iq/secrets.yaml).

scaling:
  replicas:
    integrator: 1            # with in-memory SQLite it must be 1 (multi-pod requires PostgreSQL)
    mcpServer: 1

resources:
  integrator:
    requests: { cpu: "200m", memory: "512Mi" }
    limits:   { cpu: "1000m", memory: "1024Mi" }
  mcpServer:
    requests: { cpu: "200m", memory: "256Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }

logging:
  integrator:
    level:
      - "api:server-v1:*=info"     # "api:*=debug" only while debugging
  mcpServer:
    level:
      - "api:server-v1:*=info"
