# lab-iq secrets: OpenRouter key and LiteLLM master key (the key IQ uses to call LiteLLM)
# Generated by the configuration wizard for dx-demo.apps.promox.europesip-lab.com. Contains credentials in PLAIN TEXT: keep it private.
---
apiVersion: v1
kind: Secret
metadata:
  name: litellm-env
  namespace: dx-shared
type: Opaque
stringData:
  OPENROUTER_API_KEY: '<REDACTED>'
  PROXY_MASTER_KEY: '<REDACTED>'
---
apiVersion: v1
kind: Secret
metadata:
  name: iq-litellm-api-secret
  namespace: dx-demo
type: Opaque
stringData:
  virtualKey: '<REDACTED>'
---
# The IQ deployment key. The chart hcl-dx-iq 1.0.3 cannot read it from a secret yet, only from its values: the
# install command (step 4-1) reads it from here into a variable and passes it with --set, so it is never written
# in a values file nor shown on screen.
apiVersion: v1
kind: Secret
metadata:
  name: iq-deployment-key
  namespace: dx-demo
type: Opaque
stringData:
  deploymentKey: ""        # empty: static key from iq-litellm-api-secret (no KMS)
