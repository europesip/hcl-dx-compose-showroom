# Generated by the configuration wizard for dx-demo.apps.promox.europesip-lab.com on 2026-11-10.
# Based on lab3-iq-openrouter/litellm-values.yaml (hcl-dx-compose-labs), with your values already filled in.
# lab-iq · LiteLLM (public BerriAI chart litellm-helm 1.106.5) in the shared namespace
# LiteLLM is NOT HCL software: the hcl-dx-iq chart only deploys the Integrator and the MCP Server,
# and HCL treats LiteLLM as a prerequisite. Version, patches and configuration are the
# responsibility of whoever installs it.
#
# It publishes the two logical models IQ asks for and routes them to OpenRouter:
#   iq-general-purpose -> general questions and tool use (MCP)            -> Claude Sonnet 4.6
#   iq-summary         -> conversation summary to reduce the context      -> Claude Haiku 4.5
# They are the models HCL validates, with their OpenRouter ID. To change them: change the ID
# (https://openrouter.ai/models) and run the helm upgrade of step 3-2 again. IQ is not touched.
# Cheaper option for a PoC or a lab: IQ_LLM=qwen in env.sh adds litellm-values.qwen.yaml (Qwen).
#
# Why OpenRouter and not AWS Bedrock (the HCL guides use Bedrock): see GUIDE.md, section 3.
#
# "anthropic/" provider against the OpenRouter Anthropic endpoint (and NOT "openrouter/"):
#   up to IQ 1.0.2 the HCL MCP Server published tools with dots in the name (dam.mime-type...),
#   which the anthropic/ provider sanitises and openrouter/ (OpenAI format) sends as they are, so
#   Claude rejected the request (HTTP 400). IQ 1.0.3 (CF239) already uses valid names
#   ([a-zA-Z0-9_], e.g. get_collection_from_DAM); anthropic/ is kept because it is tested and it
#   also supports the prompt caching below.
#   Format: model "anthropic/<OpenRouter id>", api_base https://openrouter.ai/api
#
# Do not use OpenAI reasoning models (gpt-5.x): they inject reasoning_effort and break the IQ
# tools. With non-Claude models, HCL says to disable enableDam in IQ.
replicaCount: 1

image:
  repository: ghcr.io/berriai/litellm
  tag: "1.106.5"            # pinned (= chart appVersion); the chart uses pullPolicy Always by default
  pullPolicy: IfNotPresent

# Master key and OpenRouter key in the litellm-env secret (lab-iq/secrets.yaml)
masterkeySecretName: litellm-env
masterkeySecretKey: PROXY_MASTER_KEY
environmentSecrets:
  - litellm-env

# No database: by default the chart deploys its own PostgreSQL (deployStandalone: true)
db:
  deployStandalone: false
  useExisting: false
migrationJob:
  enabled: false

proxy_config:
  model_list:
    - model_name: iq-general-purpose
      litellm_params:
        model: anthropic/anthropic/claude-sonnet-4.6
        api_base: https://openrouter.ai/api
        api_key: os.environ/OPENROUTER_API_KEY
        # Prompt caching: marks the system prompt as the end of the cacheable part. Anthropic caches
        # by prefix (tools -> system -> messages): it covers the ~60 tools and the prompt, which
        # are most of the tokens of every IQ request.
        cache_control_injection_points:
          - location: message
            role: system
    - model_name: iq-summary
      litellm_params:
        model: anthropic/anthropic/claude-haiku-4.5
        api_base: https://openrouter.ai/api
        api_key: os.environ/OPENROUTER_API_KEY
        cache_control_injection_points:
          - location: message
            role: system
    # Embeddings for IQ's cross-session memory (RAG, optional, see the GUIDE appendix). IQ calls a fixed
    # alias: iq-multilingual-embed (USE_MULTILINGUAL_EMBEDDINGS=true, the default) or iq-embed. HCL
    # validates Cohere embed v4, which is not on OpenRouter: BGE-M3 is multilingual and also returns
    # 1024 dimensions (= EMBEDDING_DIMENSIONS in custom-iq-values.rag.yaml). They cost nothing while
    # RAG is off: IQ only calls them with RAG_ENABLED=true.
    - model_name: iq-multilingual-embed
      litellm_params:
        model: openai/baai/bge-m3
        api_base: https://openrouter.ai/api/v1
        api_key: os.environ/OPENROUTER_API_KEY
    - model_name: iq-embed
      litellm_params:
        model: openai/baai/bge-m3
        api_base: https://openrouter.ai/api/v1
        api_key: os.environ/OPENROUTER_API_KEY
  litellm_settings:
    drop_params: true       # HCL: essential; drops parameters the provider does not accept
    json_logs: true
  general_settings:
    master_key: os.environ/PROXY_MASTER_KEY

logLevel: INFO

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 2Gi
