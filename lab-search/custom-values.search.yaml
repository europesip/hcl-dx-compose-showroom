# Generated by the configuration wizard for dx-demo.apps.promox.europesip-lab.com on 2026-11-10.
# Based on lab4-opensearch/custom-values.search.yaml (hcl-dx-compose-labs), with your values already filled in.
# lab-search · DX layer: enables Search V2 with OpenSearch.

networking:
  # "query" service of the Search Middleware (<search release>-search-middleware-query), in the
  # same namespace. HAProxy routes /dx/api/search and /dx/ui/search to it.
  searchMiddlewareService: "dx-search-search-middleware-query"

configuration:
  searchMiddleware:
    # Enables Search V2 in DX Compose (the V2 UI is already enabled in the Web Engine)
    enabled: true
    # hcl-dx-search release: the shared push-admin credential is read from it (default value).
    searchReleaseName: "dx-search"
    # DAM sends its assets to the index
    damIndexing: true
    # Search Admin UI (content sources and crawlers): https://dx-demo.apps.promox.europesip-lab.com/dx/ui/search/admin-ui
    adminUI:
      enabled: true
