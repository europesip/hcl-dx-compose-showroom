# Generated by the configuration wizard for dx-demo.apps.promox.europesip-lab.com on 2026-11-10.
# Based on lab2-ldap-postgres/a-ldap/custom-values.ldap.yaml (hcl-dx-compose-labs), with your values already filled in.
# lab-ldap · DX layer: authentication against the OpenLDAP (native LDAP block of the chart, type other). wpsadmin (basic registry) still works.
# Webinar: the BASIC layer (step 2-1). Step 2-3 replaces it with custom-values.ldap.yaml, the complete layer
# (sign in by e-mail, preferred language, LDAPS with the corporate CAs).

configuration:
  webEngine:
    ldap:
      type: "other"                 # none | dx (DX OpenLDAP) | other (external LDAP)
      host: "openldap.dx-shared.svc.cluster.local"
      port: 389
      sslEnabled: false             # lab; in production 636 + truststore (see GUIDE)
      suffix: "dc=dxdemo,dc=com"    # baseDN for searches
      serverType: "Custom"
      id: "dx_ldap"
      # Bind user (full DN) and password in a secret with keys bindUser/bindPassword
      customLdapSecret: "dx-ldap-bind"
