# Generated by the configuration wizard for dx-demo.apps.promox.europesip-lab.com on 2026-11-10.
# Based on lab2-ldap-postgres/a-ldap/custom-values.ldap.yaml (hcl-dx-compose-labs), with your values already filled in.
# lab-ldap · DX layer: authentication against the OpenLDAP (native LDAP block of the chart, type other). wpsadmin (basic registry) still works.

configuration:
  webEngine:
    ldap:
      type: "other"                 # none | dx (DX OpenLDAP) | other (external LDAP)
      host: "openldap.dx-shared.svc.cluster.local"
      port: 636                     # LDAPS
      sslEnabled: true              # the directory CA must be in the truststore of Liberty (below)
      suffix: "dc=dxdemo,dc=com"    # baseDN for searches
      serverType: "Custom"
      id: "dx_ldap"
      # Bind user (full DN) and password in a secret with keys bindUser/bindPassword
      customLdapSecret: "dx-ldap-bind"

    # LDAPS: Liberty must trust the CA that signed the certificate of the directory, otherwise the SSL handshake fails
    # ("PKIX path building failed") and nobody can sign in. The secret carries the corporate CAs of internals-ca/: the directory
    # one, and the database one, which validates PostgreSQL over SSL later (stage 3).
    customTruststoreSecrets:
      corporate-cas: "dx-corporate-cas"   # the CA certificates of internals-ca/, in the DX namespace

    # preferredLanguage (language of each user, in demo-users.ldif): the DX Compose user registry
    # does not declare it, so DX would not read it from the LDAP. With this property the DX profile
    # returns it, and DX shows the portal in that language.
    # DX Compose > Adding custom attributes (wplc-add-property).
    configOverrideFiles:
      # Sign in with the short name OR the e-mail: the native LDAP block of the chart only searches by uid and has no
      # value to change it. This fragment extends the registry the chart generates (same id, "ldap").
      ldap-login-email.xml: |
        <server description="DX Web Engine - sign in with the short name (uid) or the e-mail (mail)">
          <ldapRegistry id="ldap">
            <loginProperty name="uid"/>
            <loginProperty name="mail"/>
          </ldapRegistry>
        </server>
      preferred-language.xml: |
        <server description="DX Web Engine - preferredLanguage of the users">
          <wplc-add-property>
            <resource propertyName="preferredLanguage" dataType="String" entityTypes="PersonAccount" multiValued="false"/>
          </wplc-add-property>
        </server>
