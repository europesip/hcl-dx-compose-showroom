# Generated by the configuration wizard for dx-demo.apps.promox.europesip-lab.com on 2026-11-10.
# Based on lab2-ldap-postgres/a-ldap/openldap-values.yaml (hcl-dx-compose-labs), with your values already filled in.
# lab-ldap · Lab OpenLDAP (community chart openldap-stack-ha 4.3.3): third-party software, in the shared namespace.

global:
  ldapDomain: "dc=dxdemo,dc=com"
  # Passwords in a secret in lab-ldap/secrets.yaml (not in this file)
  existingSecret: openldap-admin

replicaCount: 1
replication:
  enabled: false             # single node: no multi-master replication

persistence:
  enabled: true
  storageClass: dx-deploy-rwo
  size: 1Gi

# Demo structure and users. Loaded ONLY on the first start (empty PVC).
customLdifCm: openldap-demo-ldif

ltb-passwd:
  enabled: false
phpldapadmin:
  enabled: false

resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits:   { cpu: 500m, memory: 512Mi }

# OpenShift: the restricted-v2 SCC does not allow the fixed runAsUser/fsGroup of the chart.
# Uncomment so that OpenShift assigns a UID from the namespace range:
# podSecurityContext:
#   enabled: false
# containerSecurityContext:
#   enabled: false

# LDAPS (port 636) with a certificate signed by the EUROPESIP Corporate Directory Root CA (internals-ca/corporate-directory-ca.crt, secret openldap-tls)
initTLSSecret:
  tls_enabled: true
  secret: openldap-tls
