# TechDocs of the HCL DX Compose showroom: the docs/ folder, shown in the EUROPESIP Internal Developer Portal (Backstage)
# through the annotation backstage.io/techdocs-ref of the catalog. Build locally (same as Backstage):
#   pip install mkdocs-techdocs-core==1.7.1 && mkdocs serve
# The repository is frozen (published webinar material): README.md, RUNBOOK.md and issues.md stay at the root and the
# home page links to them on GitHub.
site_name: HCL DX Compose showroom · Deploy HCL DX Compose in Minutes
site_description: The files of the EuropeSIP webinar "Deploy HCL DX Compose in Minutes" (12 November 2026), generated by the DX Installer Wizard
repo_url: https://github.com/europesip/hcl-dx-compose-showroom
edit_uri: edit/main/docs/
docs_dir: docs

plugins:
  - techdocs-core

nav:
  - Overview: index.md
  - Español:
      - Introducción: index.es.md

# Heading anchors as GitHub makes them (accents kept), so the same links work on GitHub and here
markdown_extensions:
  - toc:
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
