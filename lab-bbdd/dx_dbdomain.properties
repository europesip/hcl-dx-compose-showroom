# JDBC over SSL. The only difference is the end of every DbUrl:
#   without SSL: jdbc:postgresql://dx-pg-rw.dx-shared.svc.cluster.local:5432/dx_core?sslmode=disable     (our PostgreSQL rejects it)
#   with SSL:    jdbc:postgresql://dx-pg-rw.dx-shared.svc.cluster.local:5432/dx_core?sslmode=verify-full
# sslmode=verify-full encrypts the connection and checks that the certificate of PostgreSQL is signed by a trusted CA
# and matches the host name. The trusted CAs are the ones customTruststoreSecrets uploaded to Liberty: here the
# EUROPESIP Corporate Database Root CA (dx-corporate-cas). Without that CA, the connection fails (PKIX path building failed).
InitializeFeedbackDB=true
feedback.DbType=postgresql
feedback.DbName=dx_core
feedback.DbSchema=feedback
feedback.DataSourceName=wpfdbkdbDS
feedback.DbUrl=jdbc:postgresql://dx-pg-rw.dx-shared.svc.cluster.local:5432/dx_core?sslmode=verify-full
feedback.DbUser=dxuser
feedback.DbPassword=<REDACTED>
feedback.DbRuntimeUser=dxuser
feedback.DbRuntimePassword=<REDACTED>
feedback.DBA.DbUser=dxuser
feedback.DBA.DbPassword=<REDACTED>
feedback.DbConfigRoleName=WP_PZN_CONFIG_USERS
feedback.DbRuntimeRoleName=WP_PZN_RUNTIME_USERS
feedback.XDbName=dx_core
feedback.DbNode=pznNode
