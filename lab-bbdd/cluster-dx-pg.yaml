# Generated by the configuration wizard for dx-demo.apps.promox.europesip-lab.com on 2026-11-10.
# Based on lab2-ldap-postgres/b-postgres/cluster-dx-pg.yaml (hcl-dx-compose-labs), with your values already filled in.
# lab-bbdd · PostgreSQL 18 for the Web Engine, managed by CloudNativePG.
# ⚠ PostgreSQL is not supported yet by HCL for the Web Engine: this is for learning the transfer process.

apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: dx-pg
  namespace: dx-shared
spec:
  instances: 1                      # lab; 3 for HA (1 primary + 2 replicas)
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie   # pinned minor version
  primaryUpdateStrategy: unsupervised

  enableSuperuserAccess: true
  superuserSecret:
    name: dx-pg-superuser

  postgresql:
    # SSL only: any connection without encryption is rejected (DX connects over SSL)
    pg_hba:
      - hostnossl all all all reject
    parameters:
      max_connections: "500"
      # DX uses XA transactions (2PC): PostgreSQL requires max_prepared_transactions > 0
      max_prepared_transactions: "500"
      shared_buffers: "512MB"
      timezone: "Europe/Madrid"

  # Server certificate signed by the EUROPESIP Corporate Database Root CA (internals-ca/corporate-database-ca.crt): DX verifies it (sslmode=verify-full)
  certificates:
    serverTLSSecret: dx-pg-tls
    serverCASecret: dx-pg-corporate-ca
  storage:
    storageClass: dx-deploy-rwo
    size: 10Gi

  # Tablespaces used by the DX JCR. CNPG creates them declaratively, each one in its own PVC.
  tablespaces:
    - name: icmlfq32
      owner: { name: dxuser }
      storage: { storageClass: dx-deploy-rwo, size: 2Gi }
    - name: icmlnf32
      owner: { name: dxuser }
      storage: { storageClass: dx-deploy-rwo, size: 1Gi }
    - name: icmvfq04
      owner: { name: dxuser }
      storage: { storageClass: dx-deploy-rwo, size: 1Gi }
    - name: icmsfq04
      owner: { name: dxuser }
      storage: { storageClass: dx-deploy-rwo, size: 2Gi }
    - name: icmlsndx
      owner: { name: dxuser }
      storage: { storageClass: dx-deploy-rwo, size: 1Gi }

  bootstrap:
    initdb:
      database: dx_core
      owner: dxuser
      secret:
        name: dx-pg-dxuser
      encoding: UTF8
      localeCollate: en_US.UTF-8
      localeCType: en_US.UTF-8
      # Schemas, roles, grants, extensions and parameters of dx_core: run ONCE, as postgres,
      # inside dx_core. The SQL is in setup-postgres-dx.sql; install.sh (step 2B-3) loads it
      # into the dx-pg-setup-sql ConfigMap (see GUIDE, lab-bbdd step 3).
      postInitApplicationSQLRefs:
        configMapRefs:
          - name: dx-pg-setup-sql
            key: setup-postgres-dx.sql

  # Login users managed by CNPG (password in a basic-auth secret)
  managed:
    roles:
      # For the lab-iq appendix (IQ sessions in PostgreSQL). The iqdb database is created there.
      - name: dx_iq_db_user
        ensure: present
        login: true
        passwordSecret:
          name: dx-pg-iquser
