# Generated by the configuration wizard for dx-demo.apps.promox.europesip-lab.com on 2026-11-10.
# Based on lab2-ldap-postgres/b-postgres/custom-values.postgres.yaml (hcl-dx-compose-labs), with your values already filled in.
# lab-bbdd · DX layer: the Web Engine moves its database from Derby to the external database (one-off transfer on the next start).

configuration:
  webEngine:
    # JDBC over SSL: Liberty must trust the CA of PostgreSQL (internals-ca/corporate-database-ca.crt). The LDAP layer
    # already uploads it; it is repeated here so this layer also works on its own.
    customTruststoreSecrets:
      corporate-cas: "dx-corporate-cas"   # the CA certificates of internals-ca/, in the DX namespace
    # true = on the next start the Web Engine transfers the Derby data to the external database
    # ONCE. It records it when finished, so later restarts and upgrades do not repeat it.
    useExternalDatabase: true
    customDbTypePropertiesSecret: custom-credentials-webengine-dbtype-secret
    customDbDomainPropertiesSecret: custom-credentials-webengine-dbdomain-secret
    # false: the target database is empty (just created by CNPG). Set it to true only to redo
    # the transfer over a database that already has tables (it DELETES its content); in that
    # case, set it back to false as soon as it finishes (HCL recommendation).
    dropDatabaseTables: false
